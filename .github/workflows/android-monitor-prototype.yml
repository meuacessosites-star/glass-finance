name: Android monitor isolated prototype

on:
  push:
    branches: [experiment/android-financial-notification-monitor]
    paths:
      - "android-notification-monitor/**"
      - ".github/workflows/android-monitor-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-notification-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Android and run parser tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
