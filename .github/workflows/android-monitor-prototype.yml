name: Android monitor isolated prototype

on:
  push:
    branches: [experiment/android-financial-notification-monitor]
    paths:
      - "android-notification-monitor/**"
      - ".github/workflows/android-monitor-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-notification-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Ubuntu GitHub-hosted runners already include Android SDK command-line tools.
      # Avoid setup-android@v3: its deprecated `sdkmanager tools` request fails.
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Android and run parser tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
